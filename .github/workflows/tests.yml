name: Tests

# Runs the test suite on every pull request and on main, so a PR shows whether it's safe to merge without anyone
# having to run it locally first. Windows, like the release build: sprig is Windows-only, and the tests drive real git
# repos and Windows paths.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes a run still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Test
        run: dotnet test sprig.slnx --logger "console;verbosity=normal"

  # The Claude Code plugins under plugins/ and the marketplace that lists them, checked by Claude Code's own validator.
  # PluginsTests keeps their versions and hook contracts in step with sprig; this checks they're plugins at all. Pinned,
  # so a new validator can't fail a PR that changed nothing here.
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.326

      - name: Validate the marketplace and each plugin
        run: |
          claude plugin validate . --strict
          for plugin in plugins/*/; do claude plugin validate "$plugin" --strict; done
