name: Tests

# Runs the test suite on every pull request and on main, so a PR shows whether it's safe to merge without anyone
# having to run it locally first. Windows, like the release build: sprig is Windows-only, and the tests drive real git
# repos and Windows paths.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes a run still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Test
        run: dotnet test sprig.slnx --logger "console;verbosity=normal"
